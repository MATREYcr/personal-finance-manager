<!-- reference copy, not a live design-system card -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Personal Finance Manager</title>
    <link rel="stylesheet" href="../../styles.css" />
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../../_ds_bundle.js"></script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--surface-page);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" src="NavShell.jsx"></script>
    <script type="text/babel" src="Dashboard.jsx"></script>
    <script type="text/babel" src="Transactions.jsx"></script>
    <script type="text/babel" src="Categories.jsx"></script>
    <script type="text/babel" src="Recurring.jsx"></script>
    <script type="text/babel" src="Settings.jsx"></script>
    <script type="text/babel" src="Auth.jsx"></script>
    <script type="text/babel">
      const DS = window.PersonalFinanceManager_3c841c

      function useLucideRefresh(deps) {
        React.useEffect(() => {
          if (window.lucide) window.lucide.createIcons()
        })
      }

      function App() {
        const [authed, setAuthed] = React.useState(false)
        const [screen, setScreen] = React.useState('dashboard')
        const [period, setPeriod] = React.useState('month')
        const [mobile, setMobile] = React.useState(window.innerWidth < 768)
        const [mobileOpen, setMobileOpen] = React.useState(false)
        const [theme, setTheme] = React.useState('light')
        const [lang, setLang] = React.useState('en')

        React.useEffect(() => {
          document.documentElement.setAttribute('data-theme', theme)
        }, [theme])

        React.useEffect(() => {
          const onResize = () => setMobile(window.innerWidth < 768)
          window.addEventListener('resize', onResize)
          return () => window.removeEventListener('resize', onResize)
        }, [])

        useLucideRefresh([authed, screen, mobile, mobileOpen])

        if (!authed) {
          return React.createElement(window.Auth, {
            ...DS,
            mobile,
            onSignIn: () => setAuthed(true),
          })
        }

        const screens = {
          dashboard: (
            <window.Dashboard {...DS} period={period} setPeriod={setPeriod} />
          ),
          transactions: <window.Transactions {...DS} />,
          categories: <window.Categories {...DS} />,
          recurring: <window.Recurring {...DS} />,
          settings: <window.Settings {...DS} />,
        }

        return (
          <window.NavShell
            active={screen}
            onNavigate={(s) => {
              setScreen(s)
              setMobileOpen(false)
            }}
            mobile={mobile}
            mobileOpen={mobileOpen}
            onToggleMobile={() => setMobileOpen((v) => !v)}
            theme={theme}
            onToggleTheme={() =>
              setTheme((t) => (t === 'light' ? 'dark' : 'light'))
            }
            lang={lang}
            onToggleLang={setLang}
          >
            {screens[screen]}
          </window.NavShell>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
